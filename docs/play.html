<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <title>Play Scene</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>
  <script src="../src/assetLoader.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    canvas { display: block; margin: 0 auto; }
  </style>
</head>
<body>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const sceneFile = urlParams.get("scene");

    if (!sceneFile) {
      document.body.innerHTML = "<h2>Chybí parametr ?scene=</h2>";
    } else {
      const script = document.createElement("script");
      script.src = "../" + sceneFile;
      script.onload = () => {
        if (typeof window.currentScene !== "undefined") {
          const config = {
            type: Phaser.AUTO,
            width: 800,
            height: 600,
            backgroundColor: "#222",
            scene: window.currentScene
          };
          new Phaser.Game(config);
        } else {
          console.error("Scéna se nenačetla správně:", sceneFile);
        }
      };
      document.body.appendChild(script);
    }
  </script>
</body>
</html>
