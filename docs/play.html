<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <title>Play Scene</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>
  <!-- <script src="../src/env.js"></script> -->
  <!-- <script src="../src/assetLoader.js"></script> -->
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    canvas { display: block; margin: 0 auto; }
  </style>
</head>
<body>
    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const sceneFile = urlParams.get("scene");

      const IS_LOCAL = location.hostname === "localhost" ||
        location.hostname === "127.0.0.1" ||
        location.protocol === "file:";

      if (!sceneFile) {
        document.body.innerHTML = "<h2>Chybí parametr ?scene=</h2>";
      } else {
        const script = document.createElement("script");
        if (IS_LOCAL) {
          // Lokálně taháme ze složky scenes/
          script.src = "../" + sceneFile + `?v=${Date.now()}`;
        } else {
          // Na GitHub Pages taháme z raw.githubusercontent
          //https://raw.githubusercontent.com/MerlinEl/Phaser-3-Lab-Examples/main/scenes/draw/cinema_count_down_03.js
          script.src = "https://raw.githubusercontent.com/MerlinEl/Phaser-3-Lab-Examples/main/"
            + sceneFile + `?v=${Date.now()}`;
        }
        console.log("play.html > local:", IS_LOCAL, "src:", script.src);
        script.onload = () => {
          // --- Styl: class extends Phaser.Scene ---
          // vytvořit scénu: class Scene1 extends Phaser.Scene {}
          // na konci přidat: window.currentScene = Scene1;
          if (typeof window.currentScene !== "undefined") {
            const config = {
              type: Phaser.AUTO,
              width: 800,
              height: 600,
              backgroundColor: "#222",
              scene: window.currentScene
            };
            new Phaser.Game(config);
          } else if (typeof window.game !== "undefined") {
            // --- Styl: var game = new Phaser.Game(config) ---
            console.log("Scéna si spustila vlastní hru:", sceneFile);
          } else {
            console.error("Scéna se nenačetla správně:", sceneFile);
          }
        };
        document.body.appendChild(script);
      }
    </script>
</body>
</html>
