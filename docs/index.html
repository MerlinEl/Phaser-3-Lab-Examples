<!DOCTYPE HTML>
<html>
<head>
  <meta charset="UTF-8">
  <title>Mini Phaser Labs (GitHub)</title>
  <base href="/Phaser-3-Lab-Examples/"> <!-- 💡 DŮLEŽITÉ -->
  <style>
    body { font-family: sans-serif; background:#f4f4f4; margin:20px; }
    h1 { text-align:center; }
    .category { margin:20px 0; }
    ul { list-style:none; padding:0; }
    li { margin:6px 0; }
    a { text-decoration:none; color:#0077cc; }
    a:hover { text-decoration:underline; }
  </style>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
  <h1>Mini Phaser Labs (GitHub Index)</h1>
  <div id="scene-list"></div>

  <script>
    const LABS_URL = "https://labs.phaser.io/3.55/edit.html?src=";
    const BASE_URL = "https://raw.githubusercontent.com/MerlinEl/Phaser-3-Lab-Examples/main/";

    $.getJSON("scenes.json", function(data){   // už nemusí být ../
      let html = "";
      for (const category in data) {
        html += `<div class="category"><h2>${category}</h2><ul>`;
        data[category].forEach(scene => {
          const url = `${LABS_URL}${BASE_URL}${scene.file}?${Date.now()}`;
          html += `<li><a href="${url}" target="_blank">${scene.name}</a></li>`;
        });
        html += "</ul></div>";
      }
      $("#scene-list").html(html);
    });
  </script>
</body>
</html>
