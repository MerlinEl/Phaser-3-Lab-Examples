<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <title>Phaser Scene Player</title>
    <style>
        body {
            margin: 0;
            background: #222;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.js"></script>
    <script src="src/assetLoader.js"></script>
</head>

<body>
    <div id="phaser-example"></div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const sceneFile = params.get("scene");

        if (sceneFile) {
            const script = document.createElement("script");
            script.src = "scenes/" + sceneFile;
            document.body.appendChild(script);

            script.onload = () => {
                const SceneClass = window[sceneFile.replace(".js", "")];
                const config = {
                    type: Phaser.WEBGL,
                    width: 800,
                    height: 600,
                    parent: "phaser-example",
                    scene: SceneClass
                };
                new Phaser.Game(config);
            };
        } else {
            document.body.innerHTML = "<h2>Vyber scénu z index.html</h2>";
        }
    </script>
</body>

</html>
